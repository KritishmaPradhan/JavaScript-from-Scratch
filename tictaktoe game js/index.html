<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe Game</title>
    <link rel = "stylesheet" href = "main.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <video class="back-vid" id = "backgndVid" autoplay loop muted plays-inline src="videos/technology.mp4"></video>
    <div id="confetti"></div>
    <div class="winnerdisp hidedisplay ">
        <p id = "winner_player"></p>
        <button class = "playbtn">Play again</button>
    </div>
    <h1>Tic Tac Toe</h1>
    <button id="ToggleThemeBtn">
      <i class="fa fa-spinner" aria-hidden="true"></i>
    </button>
    <div class="maincontainer">
        <div class="container">
            <div class="playbox">
                <button class = "box" id="box1"></button>
                <button class = "box" id="box2"></button>
                <button class = "box" id="box3"></button>
                <button class = "box" id="box4"></button>
                <button class = "box" id="box5"></button>
                <button class = "box" id="box6"></button>
                <button class = "box" id="box7"></button>
                <button class = "box" id="box8"></button>
                <button class = "box" id="box9"></button>
            </div>
        </div>
    </div>
    <button class = "resetbtn">Reset Game</button>
    
<script src = "main.js"></script>    
</body>
</html>
